<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GetPods</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #ffffff;
      color: #000;
    }

    header {
      background: #000;
      color: white;
      padding: 20px;
      border-bottom: 4px solid #ffd000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .logo span {
      color: #ffd000;
    }

    .btn {
      background: #ffd000;
      color: black;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      background: #000;
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .hero span {
      color: #ffd000;
    }

    .produtos {
      padding: 40px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .preco {
      color: #d4a800;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    footer {
      background: #000;
      color: white;
      text-align: center;
      padding: 30px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">GET<span>PODS</span></div>
  <a class="btn" href="https://wa.me/5518997018388" target="_blank">WhatsApp</a>
</header>

<section class="hero">
  <h1>Perfumes <span>Importados</span></h1>
  <p>Os melhores perfumes com preços incríveis.</p>
  <br>
  <a class="btn" href="https://wa.me/5518997018388" target="_blank">Comprar Agora</a>
</section>

<section class="produtos">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=800&auto=format&fit=crop" alt="Perfume">
    <div class="card-content">
      <h2>Sauvage Dior</h2>
      <div class="preco">R$ 499,90</div>
      <a class="btn" href="https://wa.me/5518997018388" target="_blank">Comprar</a>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=800&auto=format&fit=crop" alt="Perfume">
    <div class="card-content">
      <h2>Bleu de Chanel</h2>
      <div class="preco">R$ 599,90</div>
      <a class="btn" href="https://wa.me/5518997018388" target="_blank">Comprar</a>
    </div>
  </div>

</section>

<footer>
  <h2>GET<span style="color:#ffd000">PODS</span></h2>
  <p>Perfumes importados com atendimento rápido no WhatsApp.</p>
</footer>

</body>
</html>
