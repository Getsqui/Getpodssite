<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GetPods</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#111;
color:white;
}

header{
background:black;
padding:20px;
text-align:center;
border-bottom:4px solid yellow;
}

header h1{
font-size:40px;
}

header span{
color:yellow;
}

.produtos{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:30px;
}

.card{
background:#1d1d1d;
border-radius:20px;
overflow:hidden;
box-shadow:0 0 15px rgba(0,0,0,0.5);
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.info{
padding:20px;
}

.info h2{
margin-bottom:10px;
}

.preco{
color:yellow;
font-size:28px;
font-weight:bold;
margin-bottom:15px;
}

.botao{
display:block;
text-align:center;
background:yellow;
color:black;
padding:12px;
border-radius:12px;
font-weight:bold;
text-decoration:none;
}

footer{
text-align:center;
padding:30px;
background:black;
margin-top:40px;
}
</style>
</head>

<body>

<header>

</a>
</div>
</div>

<div class="card">

<a class="botao" href="https://wa.me/5518997018388" target="_blank">
Comprar
</a>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1625772452859-1c03d5bf1137?q=80&w=1200&auto=format&fit=crop" alt="">
